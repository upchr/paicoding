server:
  port: 8081
  servlet:
    session:
      timeout: 5m
  compression:
    enabled: true
    min-response-size: 2KB

spring:
  config:
    import: application-dal.yml,application-web.yml,application-config.yml,application-image.yml,application-email.yml,application-rabbitmq.yml,application-ai.yml
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  mvc:
    async:
      request-timeout:
  liquibase:
    change-log: classpath:liquibase/master.xml
    enabled: true
    clear-checksums: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

servlet:
  tomcat:
    max-swallow-size: -1

security:
  salt: ${SECURITY_SALT:tech_π}
  salt-index: 3

paicoding:
  sensitive:
    enable: true
    deny:
    allow:
  jwt:
    issuer: pai_coding
    secret: ${JWT_SECRET:hello_world}
    expire: 2592000000

database:
  name: ${DATABASE_NAME:pai_coding_2026}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: classpath:mapper/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.github.paicoding.forum.web

knife4j:
  basic:
    enable: true
    username: root
    password: ${KNIFE4J_PASSWORD:123456}
  setting:
    language: zh-CN
  openapi:
    title: 技术派
    description: 一个基于 Spring Boot3、MyBatis-Plus、MySQL、Redis、ElasticSearch、RabbitMQ、Vue.js 等技术栈实现的社区系统
    version: 1.0.0
    concat:
      - HX
    license: Apache License 2.0
    email: 1499624008@qq.com
    group:
      admin:
        group-name: 后台接口分组
        api-rule: package
        api-rule-resources:
          - com.github.paicoding.forum.web.admin
      front:
        group-name: 前台接口分组
        api-rule: package
        api-rule-resources:
          - com.github.paicoding.forum.web.front

logging:
  level:
    com.github.paicoding.forum.service.rank.service.impl.*: ${LOG_LEVEL:info}

online:
  statistics:
    type: atomic_integer